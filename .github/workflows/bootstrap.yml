name: Bootstrap Project

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify required tools
        run: |
          gh --version
          jq --version

      - name: Bootstrap GitHub Project
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONFIG_FILE: .github/bootstrap/bootstrap-config.json
        run: bash .github/bootstrap/bootstrap.sh
